spring.application.name=NewYou

# 🔥 서버 포트 (원하면 바꿔도 됨)
server.port=8080

# 🔥 MySQL 접속 정보
spring.datasource.url=jdbc:mysql://localhost:3306/newyou?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 🔥 JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# 프로필 이미지 업로드 설정
# 프로필 사진 저장 폴더 → 주소: http://서버:8080/images/profile/파일이름
file.upload-dir=images/profile

# 💡 신규 추가: 친구 프로필 이미지 업로드 디렉토리 설정
file.upload-dir.friend-profile=./uploads/friendprofiles

# 파일 업로드 크기 제한 증가
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# HTTP 요청 본문 크기 제한 증가
server.max-http-header-size=10MB

# 정적 리소스 제공 (업로드된 이미지 접근)
spring.web.resources.static-locations=file:uploads/,classpath:/static/

# 💡 신규 설정: 알람 음성 파일 저장 디렉토리
file.upload-dir.voice=./uploads/voices

# 기존: jwt.secret=YOUR_VERY_LONG_AND_COMPLEX_SECRET_KEY_HERE_MIN_512BIT
# 수정: 아래 512비트 이상의 Base64 인코딩된 비밀 키로 대체합니다.
# 🚨🚨🚨 반드시 이 새로운 키로 교체하세요.
jwt.
jwt.expiration=86400000

# ================================================================
# 📱 인증 문자(SMS) 발송 설정
#  - console : 개발용. 문자를 보내지 않고 서버 콘솔에 인증번호 출력 (기본값)
#  - solapi  : 솔라피(https://solapi.com)로 실제 휴대폰에 문자 발송
# 키는 코드에 직접 쓰지 말고 환경변수로 넣으세요.
#   SMS_PROVIDER=solapi
#   SOLAPI_API_KEY=...        (솔라피 콘솔 > API Key 관리)
#   SOLAPI_API_SECRET=...
#   SOLAPI_SENDER=01012345678 (솔라피에 등록·인증된 발신번호)
# ================================================================
sms.provider=${SMS_PROVIDER:console}
sms.solapi.api-key=${SOLAPI_API_KEY:}
sms.solapi.api-secret=${SOLAPI_API_SECRET:}
sms.solapi.sender=${SOLAPI_SENDER:}