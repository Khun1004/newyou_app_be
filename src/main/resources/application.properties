spring.application.name=NewYou

# 🔥 서버 포트
server.port=8080

# 🔥 MySQL 접속 정보
spring.datasource.url=jdbc:mysql://localhost:3306/newyou?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 🔥 JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# 프로필 이미지 업로드 설정
file.upload-dir=uploads/profiles

# 친구 프로필 이미지 업로드 디렉토리
file.upload-dir.friend-profile=./uploads/friendprofiles

# 파일 업로드 크기 제한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# HTTP 요청 헤더 크기 제한
server.max-http-header-size=10MB

# 정적 리소스 제공 (업로드된 이미지 접근)
spring.web.resources.static-locations=file:uploads/,classpath:/static/

# 알람 음성 파일 저장 디렉토리
file.upload-dir.voice=./uploads/voices

# 🔑 JWT 설정 (환경변수 JWT_SECRET이 있으면 그 값을, 없으면 아래 기본값 사용)
jwt.secret=${JWT_SECRET:/IGz9WkITwLwSnaqBzFPXSvocMwSl+Rj/AmXgWA14U53K/HmzkGtoCCmePXCewBe6Dd91Prx8X3OVpnuX8NOdA==}
jwt.expiration=86400000

# 📱 인증 문자(SMS) 발송 설정
#  - console : 개발용. 문자를 보내지 않고 서버 콘솔에 인증번호 출력 (기본값)
#  - solapi  : 솔라피로 실제 휴대폰에 문자 발송
sms.provider=${SMS_PROVIDER:console}
sms.solapi.api-key=${SOLAPI_API_KEY:}
sms.solapi.api-secret=${SOLAPI_API_SECRET:}
sms.solapi.sender=${SOLAPI_SENDER:}